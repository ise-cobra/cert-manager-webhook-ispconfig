# Token Secret for the conformance suite. The suite's setupNamespace() applies this file via
# kubectl in the respective test namespace; metadata.namespace therefore stays empty.
#
# The value is a synthetic lowercase hex token that exists only in this test. It must match
# testToken in conformance_test.go verbatim. Never put a real DDNS token here.
apiVersion: v1
kind: Secret
metadata:
  name: ispconfig-ddns-token
type: Opaque
stringData:
  token: deadbeefcafe1234
